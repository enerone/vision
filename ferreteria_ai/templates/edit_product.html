<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .current-image-container {
            margin-top: 0.5rem;
            text-align: center;
        }
        .current-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            object-fit: contain;
        }

        .image-input-section {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            background-color: #fafafa;
        }

        .image-source-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .toggle-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            border-color: var(--accent-color);
            background-color: var(--accent-color);
            color: white;
        }

        .toggle-btn:hover:not(.active) {
            border-color: var(--accent-color);
        }

        .camera-container {
            display: none;
            margin-top: 1rem;
        }

        .camera-container.active {
            display: block;
        }

        #camera-video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            display: block;
        }

        .camera-controls {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .image-preview {
            margin-top: 1rem;
            display: none;
        }

        .image-preview.active {
            display: block;
        }

        .image-preview img {
            width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .preview-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .file-input-container {
            display: none;
        }

        .file-input-container.active {
            display: block;
            margin-top: 1rem;
        }

        .image-status {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 500;
        }

        .image-status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .image-status.warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .keep-current-option {
            display: none;
            margin-top: 1rem;
        }

        .keep-current-option.active {
            display: block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    {% include 'includes/navbar.html' %}

    <div class="form-container">
        <h1 style="text-align: center;">Editar Producto</h1>
        <form id="product-form" action="/products/{{ product.id }}/edit" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Nombre del Producto</label>
                <input type="text" id="name" name="name" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
                <label for="code">Código (SKU)</label>
                <input type="text" id="code" name="code" value="{{ product.code }}" required>
            </div>
            <div class="form-group">
                <label for="category">Categoría</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if product.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" name="description" rows="3">{{ product.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="stock">Stock (Cantidad)</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
            </div>
            <div class="form-group">
                <label for="price">Precio</label>
                <input type="number" id="price" name="price" step="0.01" value="{{ product.price }}" required>
            </div>

            <!-- Imagen Actual -->
            <div class="form-group">
                <label>Imagen Actual</label>
                <div class="current-image-container">
                    <img src="/{{ product.image_path }}" alt="Imagen actual" class="current-image" id="current-image">
                </div>
            </div>

            <!-- Nueva sección de imagen con cámara -->
            <div class="form-group">
                <label>Cambiar Foto del Producto (Opcional)</label>
                <div class="image-input-section">
                    <div class="image-source-toggle">
                        <button type="button" class="toggle-btn" id="toggle-keep">
                            ✓ Mantener Actual
                        </button>
                        <button type="button" class="toggle-btn" id="toggle-camera">
                            📷 Tomar Foto
                        </button>
                        <button type="button" class="toggle-btn" id="toggle-file">
                            📁 Subir Archivo
                        </button>
                    </div>

                    <!-- Mensaje de mantener actual -->
                    <div class="keep-current-option" id="keep-current-option">
                        <p style="text-align: center; color: var(--text-light);">
                            Se mantendrá la imagen actual
                        </p>
                    </div>

                    <!-- Contenedor de la cámara -->
                    <div class="camera-container" id="camera-container">
                        <video id="camera-video" autoplay playsinline></video>
                        <div class="camera-controls">
                            <button type="button" class="btn btn-primary" id="start-camera-btn">
                                Activar Cámara
                            </button>
                            <button type="button" class="btn btn-success" id="capture-photo-btn" style="display: none;">
                                📸 Capturar Foto
                            </button>
                        </div>
                    </div>

                    <!-- Contenedor de subida de archivo -->
                    <div class="file-input-container" id="file-input-container">
                        <input type="file" id="image-file" name="image" accept="image/*">
                    </div>

                    <!-- Preview de la nueva imagen -->
                    <div class="image-preview" id="image-preview">
                        <img id="preview-img" src="" alt="Vista previa">
                        <div class="preview-actions">
                            <button type="button" class="btn btn-danger" id="remove-image-btn">
                                🗑️ Eliminar
                            </button>
                        </div>
                    </div>

                    <!-- Estado de la imagen -->
                    <div id="image-status"></div>
                </div>

                <!-- Input oculto para la imagen capturada -->
                <input type="file" id="image" name="image" style="display: none;">
            </div>

            <button type="submit" class="btn btn-success" style="width: 100%;">Guardar Cambios</button>
        </form>
    </div>

    <!-- Canvas oculto para capturar frames -->
    <canvas id="capture-canvas" style="display: none;"></canvas>

    <script src="/static/js/edit_product.js"></script>
</body>
</html>
