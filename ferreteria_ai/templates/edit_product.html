<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .current-image {
            max-width: 100px;
            border-radius: 6px;
            margin-top: 0.5rem;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    {% include 'includes/navbar.html' %}

    <div class="form-container">
        <h1 style="text-align: center;">Editar Producto</h1>
        <form action="/products/{{ product.id }}/edit" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Nombre del Producto</label>
                <input type="text" id="name" name="name" value="{{ product.name }}" required>
            </div>
            <div class="form-group">
                <label for="code">Código (SKU)</label>
                <input type="text" id="code" name="code" value="{{ product.code }}" required>
            </div>
            <div class="form-group">
                <label for="description">Descripción</label>
                <textarea id="description" name="description" rows="3">{{ product.description }}</textarea>
            </div>
            <div class="form-group">
                <label for="stock">Stock (Cantidad)</label>
                <input type="number" id="stock" name="stock" value="{{ product.stock }}" required>
            </div>
            <div class="form-group">
                <label for="price">Precio</label>
                <input type="number" id="price" name="price" step="0.01" value="{{ product.price }}" required>
            </div>
            <div class="form-group">
                <label>Imagen Actual</label>
                <img src="/{{ product.image_path }}" alt="Imagen actual" class="current-image">
            </div>
            <div class="form-group">
                <label for="image">Subir Nueva Imagen (Opcional)</label>
                <input type="file" id="image" name="image" accept="image/*">
                <small>Si no seleccionas una nueva imagen, se conservará la actual.</small>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">Guardar Cambios</button>
        </form>
    </div>

</body>
</html>
